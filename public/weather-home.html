<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montvale Weather - Current Conditions & Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Main Weather Card */
        .main-weather {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        .weather-animation-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.1;
        }

        .weather-content {
            position: relative;
            z-index: 1;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.3rem;
            color: #667eea;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .current-weather {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .temp-section {
            text-align: center;
        }

        .temperature {
            font-size: 7rem;
            font-weight: 700;
            color: #667eea;
            line-height: 1;
            margin-bottom: 20px;
        }

        .condition {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .location {
            font-size: 1.5rem;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .details-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }

        .detail-item:hover {
            transform: translateY(-5px);
        }

        .detail-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .detail-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c3e50;
        }

        /* Forecast Cards */
        .forecast-section {
            animation: fadeInUp 1s ease-out;
        }

        .forecast-title {
            color: white;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-10px);
        }

        .forecast-day {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .forecast-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .forecast-temp {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .forecast-condition {
            font-size: 0.95rem;
            color: #7f8c8d;
        }

        /* Additional Info */
        .additional-info {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1.2s ease-out;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
        }

        .info-item-label {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-item-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
        }

        /* Last Updated */
        .last-updated {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
            font-size: 0.95rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .main-weather {
                padding: 30px 20px;
            }

            .current-weather {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .temperature {
                font-size: 5rem;
            }

            .condition {
                font-size: 1.5rem;
            }

            .details-section {
                grid-template-columns: 1fr;
            }

            .forecast-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Error State */
        .error {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 1.3rem;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .retry-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Montvale Weather</h1>
            <p>Current conditions and forecast</p>
        </div>

        <div id="weatherContent">
            <div class="loading">Loading weather data</div>
        </div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        const GEOCODING_API = 'https://geocoding-api.open-meteo.com/v1/search';
        const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
        const CITY = 'Montvale';

        const weatherIcons = {
            0: '☀️',
            1: '🌤️',
            2: '⛅',
            3: '☁️',
            45: '🌫️',
            48: '🌫️',
            51: '🌦️',
            53: '🌦️',
            55: '🌧️',
            61: '🌧️',
            63: '🌧️',
            65: '🌧️',
            71: '🌨️',
            73: '🌨️',
            75: '❄️',
            77: '🌨️',
            80: '🌦️',
            81: '🌧️',
            82: '⛈️',
            85: '🌨️',
            86: '❄️',
            95: '⛈️',
            96: '⛈️',
            99: '⛈️'
        };

        const weatherDescriptions = {
            0: 'Clear sky',
            1: 'Mainly clear',
            2: 'Partly cloudy',
            3: 'Overcast',
            45: 'Foggy',
            48: 'Depositing rime fog',
            51: 'Light drizzle',
            53: 'Moderate drizzle',
            55: 'Dense drizzle',
            61: 'Slight rain',
            63: 'Moderate rain',
            65: 'Heavy rain',
            71: 'Slight snow',
            73: 'Moderate snow',
            75: 'Heavy snow',
            77: 'Snow grains',
            80: 'Slight rain showers',
            81: 'Moderate rain showers',
            82: 'Violent rain showers',
            85: 'Slight snow showers',
            86: 'Heavy snow showers',
            95: 'Thunderstorm',
            96: 'Thunderstorm with slight hail',
            99: 'Thunderstorm with heavy hail'
        };

        function getWeatherIcon(code) {
            return weatherIcons[code] || '🌡️';
        }

        function getWeatherDescription(code) {
            return weatherDescriptions[code] || 'Unknown';
        }

        function getWindDirection(degrees) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(degrees / 45) % 8;
            return directions[index];
        }

        async function getCoordinates(city) {
            const response = await fetch(`${GEOCODING_API}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                throw new Error('City not found');
            }

            return {
                lat: data.results[0].latitude,
                lon: data.results[0].longitude,
                name: data.results[0].name,
                country: data.results[0].country
            };
        }

        async function getWeather(lat, lon, cityName, country) {
            const response = await fetch(
                `${WEATHER_API}?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,weathercode,uv_index,pm2_5,pm10&daily=weathercode,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`
            );

            const data = await response.json();
            return { data, cityName, country };
        }

        function getAirQualityLevel(pm25) {
            if (pm25 === undefined || pm25 === null) return { level: 'N/A', color: '#999', emoji: '🌫️' };
            if (pm25 <= 12) return { level: 'Good', color: '#4CAF50', emoji: '😊' };
            if (pm25 <= 35) return { level: 'Moderate', color: '#FFC107', emoji: '😐' };
            if (pm25 <= 55) return { level: 'Unhealthy for Sensitive', color: '#FF9800', emoji: '😷' };
            if (pm25 <= 150) return { level: 'Unhealthy', color: '#F44336', emoji: '😨' };
            if (pm25 <= 250) return { level: 'Very Unhealthy', color: '#9C27B0', emoji: '🤢' };
            return { level: 'Hazardous', color: '#880E4F', emoji: '☠️' };
        }

        function getUVLevel(uv) {
            if (uv === undefined || uv === null) return { level: 'N/A', color: '#999' };
            if (uv <= 2) return { level: 'Low', color: '#4CAF50' };
            if (uv <= 5) return { level: 'Moderate', color: '#FFC107' };
            if (uv <= 7) return { level: 'High', color: '#FF9800' };
            if (uv <= 10) return { level: 'Very High', color: '#F44336' };
            return { level: 'Extreme', color: '#9C27B0' };
        }

        function displayWeather({ data, cityName, country }) {
            const current = data.current_weather;
            const currentHour = new Date(current.time).getHours();
            const humidity = data.hourly.relative_humidity_2m[currentHour];
            const feelsLike = data.hourly.apparent_temperature[currentHour];
            const precipProb = data.hourly.precipitation_probability[currentHour];
            const pm25 = data.hourly.pm2_5[currentHour];
            const uvIndex = data.hourly.uv_index[currentHour];
            const airQuality = getAirQualityLevel(pm25);
            const uvLevel = getUVLevel(uvIndex);

            const html = `
                <div class="main-weather">
                    <div class="weather-content">
                        <div class="current-weather">
                            <div class="temp-section">
                                <div class="temperature">${Math.round(current.temperature)}°</div>
                                <div class="condition">${getWeatherDescription(current.weathercode)}</div>
                                <div class="location">
                                    <span>📍</span>
                                    <span>${cityName}, ${country}</span>
                                </div>
                                <div class="location" style="font-size: 1.2rem; margin-top: 10px;">
                                    <span>🌡️</span>
                                    <span>Feels like ${Math.round(feelsLike)}°C</span>
                                </div>
                                <div class="location" style="font-size: 1.2rem; margin-top: 5px;">
                                    <span>${airQuality.emoji}</span>
                                    <span style="color: ${airQuality.color}; font-weight: 600;">Air Quality: ${airQuality.level}</span>
                                </div>
                            </div>
                            <div class="details-section">
                                <div class="detail-item">
                                    <div class="detail-icon">💧</div>
                                    <div class="detail-label">Humidity</div>
                                    <div class="detail-value">${humidity}%</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-icon">💨</div>
                                    <div class="detail-label">Wind</div>
                                    <div class="detail-value">${Math.round(current.windspeed)} km/h</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-icon">🧭</div>
                                    <div class="detail-label">Direction</div>
                                    <div class="detail-value">${getWindDirection(current.winddirection)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-icon">☀️</div>
                                    <div class="detail-label">UV Index</div>
                                    <div class="detail-value" style="color: ${uvLevel.color}">${Math.round(uvIndex || 0)}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <h2 class="forecast-title">7-Day Forecast</h2>
                    <div class="forecast-grid">
                        ${generateForecast(data.daily)}
                    </div>
                </div>

                <div class="additional-info">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-item-label">Precipitation</div>
                            <div class="info-item-value">${precipProb || 0}%</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">PM2.5</div>
                            <div class="info-item-value" style="color: ${airQuality.color}">${pm25 ? pm25.toFixed(1) : 'N/A'} µg/m³</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">UV Level</div>
                            <div class="info-item-value" style="color: ${uvLevel.color}">${uvLevel.level}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Today's High</div>
                            <div class="info-item-value">${Math.round(data.daily.temperature_2m_max[0])}°C</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Today's Low</div>
                            <div class="info-item-value">${Math.round(data.daily.temperature_2m_min[0])}°C</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Max UV Today</div>
                            <div class="info-item-value">${Math.round(data.daily.uv_index_max[0] || 0)}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('weatherContent').innerHTML = html;
            document.getElementById('lastUpdated').textContent =
                `Last updated: ${new Date(current.time).toLocaleString()}`;
        }

        function generateForecast(daily) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            let html = '';

            for (let i = 0; i < 7; i++) {
                const date = new Date(daily.time[i]);
                const dayName = i === 0 ? 'Today' : days[date.getDay()];
                const weatherCode = daily.weathercode[i];
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);

                html += `
                    <div class="forecast-card">
                        <div class="forecast-day">${dayName}</div>
                        <div class="forecast-icon">${getWeatherIcon(weatherCode)}</div>
                        <div class="forecast-temp">${maxTemp}° / ${minTemp}°</div>
                        <div class="forecast-condition">${getWeatherDescription(weatherCode)}</div>
                    </div>
                `;
            }

            return html;
        }

        function showError(message) {
            document.getElementById('weatherContent').innerHTML = `
                <div class="error">
                    <div class="error-icon">⚠️</div>
                    <div class="error-message">${message}</div>
                    <button class="retry-btn" onclick="loadWeather()">Retry</button>
                </div>
            `;
        }

        async function loadWeather() {
            try {
                document.getElementById('weatherContent').innerHTML = '<div class="loading">Loading weather data</div>';
                const location = await getCoordinates(CITY);
                const weatherData = await getWeather(location.lat, location.lon, location.name, location.country);
                displayWeather(weatherData);
            } catch (error) {
                console.error('Error loading weather:', error);
                showError('Failed to load weather data. Please try again.');
            }
        }

        // Load weather on page load
        window.addEventListener('load', loadWeather);

        // Refresh weather every 10 minutes
        setInterval(loadWeather, 600000);
    </script>
</body>
</html>
