<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Display Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-board {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 15px 35px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .display-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .main-display {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .weather-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .weather-content {
            position: relative;
            z-index: 1;
        }

        /* Sun Animation */
        .sun {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 30px #FFD700;
            animation: rotateSun 20s linear infinite;
        }

        .sun::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background:
                linear-gradient(0deg, transparent 45%, #FFD700 45%, #FFD700 55%, transparent 55%),
                linear-gradient(45deg, transparent 45%, #FFD700 45%, #FFD700 55%, transparent 55%),
                linear-gradient(90deg, transparent 45%, #FFD700 45%, #FFD700 55%, transparent 55%),
                linear-gradient(135deg, transparent 45%, #FFD700 45%, #FFD700 55%, transparent 55%);
            animation: rotateSun 20s linear infinite reverse;
        }

        @keyframes rotateSun {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Cloud Animation */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
            opacity: 0;
            animation: moveCloud 15s ease-in-out infinite;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 40px;
            left: -100px;
            animation-delay: 0s;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 120px;
            height: 45px;
            top: 100px;
            left: -120px;
            animation-delay: 5s;
        }

        .cloud2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 15px;
        }

        .cloud2::after {
            width: 70px;
            height: 45px;
            top: -18px;
            right: 15px;
        }

        .cloud3 {
            width: 90px;
            height: 35px;
            top: 150px;
            left: -90px;
            animation-delay: 10s;
        }

        .cloud3::before {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 10px;
        }

        .cloud3::after {
            width: 55px;
            height: 35px;
            top: -12px;
            right: 10px;
        }

        @keyframes moveCloud {
            0% {
                left: -150px;
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        /* Rain Animation */
        .rain {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8));
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                top: -50px;
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0.3;
            }
        }

        /* Snow Animation */
        .snowflake {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: snowfall linear infinite;
        }

        @keyframes snowfall {
            0% {
                top: -50px;
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Fog Animation */
        .fog {
            position: absolute;
            width: 100%;
            height: 100px;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(20px);
            animation: fogMove 8s ease-in-out infinite alternate;
        }

        .fog1 {
            top: 20%;
            animation-delay: 0s;
        }

        .fog2 {
            top: 50%;
            animation-delay: 2s;
        }

        .fog3 {
            top: 70%;
            animation-delay: 4s;
        }

        @keyframes fogMove {
            0% {
                transform: translateX(-20%);
                opacity: 0.3;
            }
            100% {
                transform: translateX(20%);
                opacity: 0.6;
            }
        }

        /* Lightning Animation */
        .lightning {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0);
            animation: flash 4s ease-in-out infinite;
        }

        @keyframes flash {
            0%, 20%, 40%, 100% {
                background: rgba(255, 255, 255, 0);
            }
            10%, 30% {
                background: rgba(255, 255, 255, 0.8);
            }
        }

        /* Stars for night clear sky */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .city-name {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .temperature-display {
            font-size: 6rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1;
        }

        .weather-condition {
            font-size: 1.5rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-card-title {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .info-card-unit {
            font-size: 1rem;
            color: #7f8c8d;
        }

        .additional-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            grid-column: 1 / -1;
        }

        .additional-info h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .info-value {
            color: #2c3e50;
            font-weight: 600;
            font-size: 1rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #667eea;
        }

        .error {
            background: #ffe6e6;
            color: #c0392b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .weather-board {
                padding: 25px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .display-board {
                grid-template-columns: 1fr;
            }

            .temperature-display {
                font-size: 4rem;
            }

            .search-container {
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="weather-board">
        <div class="header">
            <h1>Weather Display Board</h1>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="cityInput" placeholder="Enter city name...">
            <button class="search-btn" id="searchBtn">Get Weather</button>
        </div>

        <div id="error" class="error hidden"></div>
        <div id="loading" class="loading hidden">Loading weather data...</div>

        <div id="weatherContent" class="hidden">
            <div class="display-board">
                <div class="main-display">
                    <div class="weather-animation" id="weatherAnimation"></div>
                    <div class="weather-content">
                        <div class="city-name" id="cityName">Montvale</div>
                        <div class="temperature-display" id="temperature">--°</div>
                        <div class="weather-condition" id="condition">--</div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-card-title">Wind Speed</div>
                    <div class="info-card-value">
                        <span id="windSpeed">--</span>
                        <span class="info-card-unit">km/h</span>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-card-title">Humidity</div>
                    <div class="info-card-value">
                        <span id="humidity">--</span>
                        <span class="info-card-unit">%</span>
                    </div>
                </div>
            </div>

            <div class="additional-info">
                <h3>Additional Information</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Weather Code</span>
                        <span class="info-value" id="weatherCode">--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Wind Direction</span>
                        <span class="info-value" id="windDirection">--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Last Updated</span>
                        <span class="info-value" id="lastUpdated">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.open-meteo.com/v1/forecast';
        const GEOCODING_API = 'https://geocoding-api.open-meteo.com/v1/search';

        const elements = {
            cityInput: document.getElementById('cityInput'),
            searchBtn: document.getElementById('searchBtn'),
            error: document.getElementById('error'),
            loading: document.getElementById('loading'),
            weatherContent: document.getElementById('weatherContent'),
            cityName: document.getElementById('cityName'),
            temperature: document.getElementById('temperature'),
            condition: document.getElementById('condition'),
            windSpeed: document.getElementById('windSpeed'),
            humidity: document.getElementById('humidity'),
            weatherCode: document.getElementById('weatherCode'),
            windDirection: document.getElementById('windDirection'),
            lastUpdated: document.getElementById('lastUpdated'),
            weatherAnimation: document.getElementById('weatherAnimation')
        };

        const weatherDescriptions = {
            0: 'Clear sky',
            1: 'Mainly clear',
            2: 'Partly cloudy',
            3: 'Overcast',
            45: 'Foggy',
            48: 'Depositing rime fog',
            51: 'Light drizzle',
            53: 'Moderate drizzle',
            55: 'Dense drizzle',
            61: 'Slight rain',
            63: 'Moderate rain',
            65: 'Heavy rain',
            71: 'Slight snow',
            73: 'Moderate snow',
            75: 'Heavy snow',
            77: 'Snow grains',
            80: 'Slight rain showers',
            81: 'Moderate rain showers',
            82: 'Violent rain showers',
            85: 'Slight snow showers',
            86: 'Heavy snow showers',
            95: 'Thunderstorm',
            96: 'Thunderstorm with slight hail',
            99: 'Thunderstorm with heavy hail'
        };

        function getWeatherDescription(code) {
            return weatherDescriptions[code] || 'Unknown';
        }

        function getWindDirection(degrees) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(degrees / 45) % 8;
            return directions[index];
        }

        function showError(message) {
            elements.error.textContent = message;
            elements.error.classList.remove('hidden');
            elements.loading.classList.add('hidden');
            elements.weatherContent.classList.add('hidden');
        }

        function showLoading() {
            elements.loading.classList.remove('hidden');
            elements.error.classList.add('hidden');
            elements.weatherContent.classList.add('hidden');
        }

        function showWeather() {
            elements.weatherContent.classList.remove('hidden');
            elements.loading.classList.add('hidden');
            elements.error.classList.add('hidden');
        }

        async function getCoordinates(city) {
            const response = await fetch(`${GEOCODING_API}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);

            if (!response.ok) {
                throw new Error('Failed to fetch location data');
            }

            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                throw new Error('City not found. Please try another city.');
            }

            return {
                lat: data.results[0].latitude,
                lon: data.results[0].longitude,
                name: data.results[0].name,
                country: data.results[0].country
            };
        }

        async function getWeather(lat, lon, cityName, country) {
            const response = await fetch(
                `${API_BASE}?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relative_humidity_2m&timezone=auto`
            );

            if (!response.ok) {
                throw new Error('Failed to fetch weather data');
            }

            const data = await response.json();
            const current = data.current_weather;
            const currentHour = new Date(current.time).getHours();
            const humidity = data.hourly.relative_humidity_2m[currentHour];

            displayWeather({
                city: `${cityName}, ${country}`,
                temperature: Math.round(current.temperature),
                condition: getWeatherDescription(current.weathercode),
                windSpeed: Math.round(current.windspeed),
                humidity: humidity || '--',
                weatherCode: current.weathercode,
                windDirection: getWindDirection(current.winddirection),
                time: new Date(current.time).toLocaleString()
            });
        }

        function createSunAnimation() {
            const sun = document.createElement('div');
            sun.className = 'sun';
            return sun;
        }

        function createCloudAnimation() {
            const fragment = document.createDocumentFragment();
            for (let i = 1; i <= 3; i++) {
                const cloud = document.createElement('div');
                cloud.className = `cloud cloud${i}`;
                fragment.appendChild(cloud);
            }
            return fragment;
        }

        function createRainAnimation() {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 50; i++) {
                const rain = document.createElement('div');
                rain.className = 'rain';
                rain.style.left = `${Math.random() * 100}%`;
                rain.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                rain.style.animationDelay = `${Math.random() * 2}s`;
                fragment.appendChild(rain);
            }
            return fragment;
        }

        function createSnowAnimation() {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 30; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.style.left = `${Math.random() * 100}%`;
                snowflake.style.animationDuration = `${2 + Math.random() * 3}s`;
                snowflake.style.animationDelay = `${Math.random() * 3}s`;
                fragment.appendChild(snowflake);
            }
            return fragment;
        }

        function createFogAnimation() {
            const fragment = document.createDocumentFragment();
            for (let i = 1; i <= 3; i++) {
                const fog = document.createElement('div');
                fog.className = `fog fog${i}`;
                fragment.appendChild(fog);
            }
            return fragment;
        }

        function createThunderstormAnimation() {
            const fragment = document.createDocumentFragment();

            // Add dark clouds
            const clouds = createCloudAnimation();
            fragment.appendChild(clouds);

            // Add rain
            const rain = createRainAnimation();
            fragment.appendChild(rain);

            // Add lightning
            const lightning = document.createElement('div');
            lightning.className = 'lightning';
            fragment.appendChild(lightning);

            return fragment;
        }

        function setWeatherAnimation(weatherCode) {
            // Clear previous animation
            elements.weatherAnimation.innerHTML = '';

            let animation;

            // Clear sky
            if (weatherCode === 0 || weatherCode === 1) {
                animation = createSunAnimation();
            }
            // Partly cloudy
            else if (weatherCode === 2) {
                const fragment = document.createDocumentFragment();
                fragment.appendChild(createSunAnimation());
                fragment.appendChild(createCloudAnimation());
                animation = fragment;
            }
            // Overcast/Cloudy
            else if (weatherCode === 3) {
                animation = createCloudAnimation();
            }
            // Fog
            else if (weatherCode === 45 || weatherCode === 48) {
                animation = createFogAnimation();
            }
            // Drizzle or Rain
            else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(weatherCode)) {
                const fragment = document.createDocumentFragment();
                fragment.appendChild(createCloudAnimation());
                fragment.appendChild(createRainAnimation());
                animation = fragment;
            }
            // Snow
            else if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) {
                const fragment = document.createDocumentFragment();
                fragment.appendChild(createCloudAnimation());
                fragment.appendChild(createSnowAnimation());
                animation = fragment;
            }
            // Thunderstorm
            else if ([95, 96, 99].includes(weatherCode)) {
                animation = createThunderstormAnimation();
            }
            // Default: clouds
            else {
                animation = createCloudAnimation();
            }

            if (animation) {
                elements.weatherAnimation.appendChild(animation);
            }
        }

        function displayWeather(data) {
            elements.cityName.textContent = data.city;
            elements.temperature.textContent = `${data.temperature}°`;
            elements.condition.textContent = data.condition;
            elements.windSpeed.textContent = data.windSpeed;
            elements.humidity.textContent = data.humidity;
            elements.weatherCode.textContent = data.weatherCode;
            elements.windDirection.textContent = data.windDirection;
            elements.lastUpdated.textContent = data.time;

            // Set weather animation
            setWeatherAnimation(data.weatherCode);

            showWeather();
        }

        async function fetchWeatherForCity(city) {
            try {
                showLoading();
                const location = await getCoordinates(city);
                await getWeather(location.lat, location.lon, location.name, location.country);
            } catch (error) {
                showError(error.message);
            }
        }

        elements.searchBtn.addEventListener('click', () => {
            const city = elements.cityInput.value.trim();
            if (city) {
                fetchWeatherForCity(city);
            } else {
                showError('Please enter a city name');
            }
        });

        elements.cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = elements.cityInput.value.trim();
                if (city) {
                    fetchWeatherForCity(city);
                }
            }
        });

        // Load default city on page load
        window.addEventListener('load', () => {
            fetchWeatherForCity('Montvale');
        });
    </script>
</body>
</html>
