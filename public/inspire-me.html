<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InspireMe - Inspirational Quote Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .tagline {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-style: italic;
        }

        .quote-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .quote-container::before {
            content: '"';
            position: absolute;
            top: -20px;
            left: 20px;
            font-size: 120px;
            color: rgba(102, 126, 234, 0.1);
            font-family: Georgia, serif;
        }

        .quote-text {
            font-size: 1.8rem;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .quote-author {
            font-size: 1.3rem;
            color: #667eea;
            font-weight: 600;
            font-style: italic;
        }

        .quote-author::before {
            content: '— ';
        }

        .loading {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: 500;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 25px rgba(245, 87, 108, 0.6);
        }

        .btn-icon {
            font-size: 1.3rem;
        }

        .stats {
            margin-top: 30px;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            background: rgba(231, 76, 60, 0.1);
            border: 2px solid #e74c3c;
            color: #c0392b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .logo {
                font-size: 3rem;
            }

            .quote-text {
                font-size: 1.4rem;
            }

            .quote-author {
                font-size: 1.1rem;
            }

            .btn {
                padding: 15px 30px;
                font-size: 1rem;
            }

            .buttons {
                flex-direction: column;
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo">✨</div>
        <h1>InspireMe</h1>
        <p class="tagline">Your daily dose of inspiration</p>

        <div id="error" class="error" style="display: none;"></div>

        <div class="quote-container" id="quoteContainer">
            <div class="loading" id="loading">Loading inspiration</div>
            <div id="quoteContent" style="display: none;">
                <p class="quote-text" id="quoteText"></p>
                <p class="quote-author" id="quoteAuthor"></p>
            </div>
        </div>

        <div class="buttons">
            <button class="btn" onclick="getNewQuote()">
                <span class="btn-icon">🎲</span>
                <span>New Quote</span>
            </button>
            <button class="btn btn-secondary" onclick="copyQuote()">
                <span class="btn-icon">📋</span>
                <span>Copy Quote</span>
            </button>
        </div>

        <div class="stats">
            <span id="quoteCount">0</span> quotes generated in this session
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast">Quote copied to clipboard!</div>

    <script>
        let quoteCount = 0;
        let currentQuote = '';
        let currentAuthor = '';

        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 50 + 10;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Fetch quote from API
        async function getNewQuote() {
            const loading = document.getElementById('loading');
            const quoteContent = document.getElementById('quoteContent');
            const errorDiv = document.getElementById('error');

            // Show loading
            loading.style.display = 'block';
            quoteContent.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('https://api.quotable.io/random');

                if (!response.ok) {
                    throw new Error('Failed to fetch quote');
                }

                const data = await response.json();

                currentQuote = data.content;
                currentAuthor = data.author;

                // Update UI
                document.getElementById('quoteText').textContent = currentQuote;
                document.getElementById('quoteAuthor').textContent = currentAuthor;

                // Hide loading, show quote
                loading.style.display = 'none';
                quoteContent.style.display = 'block';

                // Add animation
                const container = document.getElementById('quoteContainer');
                container.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    container.style.transform = 'scale(1)';
                }, 100);

                // Update counter
                quoteCount++;
                document.getElementById('quoteCount').textContent = quoteCount;

            } catch (error) {
                console.error('Error fetching quote:', error);
                loading.style.display = 'none';
                errorDiv.textContent = 'Oops! Could not fetch a new quote. Please try again.';
                errorDiv.style.display = 'block';
            }
        }

        // Copy quote to clipboard
        async function copyQuote() {
            if (!currentQuote) {
                showToast('No quote to copy!', false);
                return;
            }

            const fullQuote = `"${currentQuote}" — ${currentAuthor}`;

            try {
                await navigator.clipboard.writeText(fullQuote);
                showToast('Quote copied to clipboard!', true);
            } catch (error) {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = fullQuote;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('Quote copied to clipboard!', true);
                } catch (err) {
                    showToast('Could not copy quote', false);
                }
                document.body.removeChild(textArea);
            }
        }

        // Show toast notification
        function showToast(message, success = true) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = success ? '#27ae60' : '#e74c3c';
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                getNewQuote();
            } else if (e.key === 'c' || e.key === 'C') {
                copyQuote();
            }
        });

        // Initialize
        createParticles();
        getNewQuote();
    </script>
</body>
</html>
